<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5c99"/>
      <stop offset="100%" stop-color="#5ba3d9"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Ground -->
  <path d="M0 355 Q128 338 256 348 Q384 358 512 342 L512 512 L0 512 Z" fill="url(#ground)"/>

  <!-- Mountain silhouette -->
  <path d="M80 372 L256 82 L432 372 Z" fill="#1b4332"/>

  <!-- Sunlit face of mountain (subtle depth) -->
  <path d="M256 82 L316 228 L256 248 L196 228 Z" fill="#2d6a4f" opacity="0.45"/>

  <!-- Snow cap -->
  <path d="M256 82 L300 164 L256 153 L212 164 Z" fill="white" opacity="0.96"/>

  <!-- Dotted trail across foreground -->
  <path d="M38 452 Q160 422 256 434 Q352 446 474 418"
        fill="none" stroke="white" stroke-width="20"
        stroke-dasharray="34,26" stroke-linecap="round" opacity="0.95"/>
</svg>
