<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- Forest green background -->
  <rect width="512" height="512" fill="#1b4332"/>

  <!-- Pine tree — 3 tiers, centered -->
  <path d="M256 68 L298 182 L214 182 Z" fill="#74c69d"/>
  <path d="M256 145 L312 272 L200 272 Z" fill="#74c69d"/>
  <path d="M256 222 L334 368 L178 368 Z" fill="#74c69d"/>
  <!-- Subtle shadow side on each tier for depth -->
  <path d="M256 68 L298 182 L256 182 Z"  fill="#52b788" opacity="0.5"/>
  <path d="M256 145 L312 272 L256 272 Z" fill="#52b788" opacity="0.5"/>
  <path d="M256 222 L334 368 L256 368 Z" fill="#52b788" opacity="0.5"/>
  <!-- Trunk -->
  <rect x="240" y="365" width="32" height="52" rx="5" fill="#40916c"/>

  <!-- Bird — simple perched silhouette, coral/red, upper right -->
  <!-- Body -->
  <ellipse cx="394" cy="156" rx="46" ry="22" fill="#e8604a" transform="rotate(-8 394 156)"/>
  <!-- Head -->
  <circle cx="432" cy="138" r="24" fill="#e8604a"/>
  <!-- Beak -->
  <path d="M454 135 L476 129 L454 148 Z" fill="#c0432a"/>
  <!-- Tail -->
  <path d="M350 163 L318 147 L322 167 L318 183 L352 176 Z" fill="#e8604a"/>
  <!-- Belly -->
  <ellipse cx="400" cy="163" rx="26" ry="13" fill="#f2856e" opacity="0.6"/>
  <!-- Eye -->
  <circle cx="436" cy="134" r="6"   fill="white"/>
  <circle cx="437" cy="134" r="3.5" fill="#1a0800"/>
  <circle cx="438" cy="133" r="1.2" fill="white"/>

  <!-- Dotted trail across the lower foreground -->
  <path d="M42 448 Q180 428 256 438 Q332 448 470 430"
        fill="none" stroke="white" stroke-width="20"
        stroke-dasharray="34,26" stroke-linecap="round" opacity="0.92"/>

</svg>
