<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#1b4332"/>

  <!-- Sky gradient area -->
  <rect width="512" height="280" fill="#2d6a4f" opacity="0.4"/>

  <!-- Mountains -->
  <polygon points="0,340 110,140 220,340" fill="#40916c"/>
  <polygon points="100,340 240,100 380,340" fill="#2d6a4f"/>
  <polygon points="290,340 400,160 512,340" fill="#40916c"/>

  <!-- Snow caps -->
  <polygon points="185,130 240,100 295,130 260,148 220,148" fill="white" opacity="0.85"/>
  <polygon points="98,156 110,140 122,156 112,163 104,163" fill="white" opacity="0.75"/>

  <!-- Ground / meadow -->
  <rect x="0" y="340" width="512" height="172" fill="#52b788"/>
  <path d="M0 340 Q128 320 256 335 Q384 350 512 330 L512 360 Q384 375 256 360 Q128 345 0 365 Z" fill="#74c69d" opacity="0.6"/>

  <!-- Hiking trail path -->
  <path d="M80 500 Q160 460 220 430 Q280 400 320 380 Q370 358 420 340" fill="none" stroke="#d8f3dc" stroke-width="8" stroke-dasharray="18,12" stroke-linecap="round" opacity="0.7"/>

