  <ellipse cx="196" cy="464" rx="7" ry="9" fill="#1b4332" opacity="0.5" transform="rotate(-15,196,464)"/>

  <!-- Footprint right -->
  <ellipse cx="230" cy="458" rx="14" ry="20" fill="#1b4332" opacity="0.6" transform="rotate(15,230,458)"/>
  <ellipse cx="214" cy="450" rx="7" ry="9" fill="#1b4332" opacity="0.5" transform="rotate(15,214,450)"/>

  <!-- Sun -->
  <circle cx="420" cy="80" r="36" fill="#d8f3dc" opacity="0.9"/>
  <line x1="420" y1="30" x2="420" y2="14" stroke="#d8f3dc" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="420" y1="130" x2="420" y2="146" stroke="#d8f3dc" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="370" y1="80" x2="354" y2="80" stroke="#d8f3dc" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="470" y1="80" x2="486" y2="80" stroke="#d8f3dc" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="385" y1="45" x2="374" y2="34" stroke="#d8f3dc" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="455" y1="115" x2="466" y2="126" stroke="#d8f3dc" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="455" y1="45" x2="466" y2="34" stroke="#d8f3dc" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="385" y1="115" x2="374" y2="126" stroke="#d8f3dc" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
